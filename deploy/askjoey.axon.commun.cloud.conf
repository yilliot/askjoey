# askjoey.axon.commun.cloud → Joey Lee's listing site (static), built on the Mini in ~/lab/askjoey/site
# and shipped by ~/lab/askjoey/deploy/deploy.sh to /srv/askjoey/releases/<stamp>; "current" points at the live one.
# The exact server_name wins over the *.axon.commun.cloud wildcard in sites-enabled/axon.commun.cloud,
# which also handles the port 80 → https redirect. Installed by deploy/install.sh.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name askjoey.axon.commun.cloud;

    ssl_certificate /etc/nginx/ssl/axon.commun.cloud.pem;
    ssl_certificate_key /etc/nginx/ssl/axon.commun.cloud.key;

    root /srv/askjoey/current;
    index index.html;
    error_page 404 /404.html;
    disable_symlinks off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Hashed build assets never change: cache for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Preview address: keep it out of search engines until Joey's own domain is live.
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }
}
